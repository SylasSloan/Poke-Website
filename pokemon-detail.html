<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Details</title>
    <link rel="stylesheet" href="css/pokemon-detail.css">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="back-link" href="index.html">← Back to Pokémon database</a>
            <div class="pager">
                <a id="pager-prev" aria-disabled="true">← Prev</a>
                <a id="pager-next" aria-disabled="true">Next →</a>
            </div>
            <div class="status" id="status">Loading details…</div>
        </div>
        <div class="card" id="detail-card" hidden>
            <div class="hero">
                <img id="sprite" alt="Pokémon sprite" />
                <div class="hero-main">
                    <div class="eyebrow" id="eyebrow">Pokémon details</div>
                    <h1 id="name"></h1>
                    <div class="meta" id="meta"></div>
                    <div class="types" id="types"></div>
                    <div id="description" class="muted"></div>
                    <div class="info-boxes" id="info-boxes"></div>
                </div>
            </div>

            <div class="section">
                <h2>Base stats</h2>
                <div id="stats" class="stat-list"></div>
            </div>

            <div class="section">
                <h2>Type defenses</h2>
                <div id="type-defenses"></div>
            </div>

            <div class="section">
                <h2>Evolution chart</h2>
                <div id="evolution-chart"></div>
            </div>

            <div class="section">
                <h2>Abilities</h2>
                <div id="abilities"></div>
            </div>

            <div class="section">
                <h2>Moves by generation</h2>
                <div class="gen-tabs" id="move-gen-tabs"></div>
                <div class="grid">
                    <div class="panel">
                        <h3>Moves learned by leveling up</h3>
                        <div id="level-up-moves"></div>
                    </div>
                    <div class="panel">
                        <h3>Other moves</h3>
                        <div id="machine-moves"></div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Wild encounters</h2>
                <div class="gen-tabs" id="encounter-gen-tabs"></div>
                <div id="encounters"></div>
            </div>

            <div class="section">
                <h2>Pokédex entries</h2>
                <div id="dex-entries"></div>
            </div>

            <div class="section">
                <h2>Sprites</h2>
                <div id="sprite-gallery"></div>
            </div>

            <div class="section">
                <h2>In other languages</h2>
                <div id="languages"></div>
            </div>

            <div class="section">
                <h2>Additional notes</h2>
                <div id="notes" class="muted"></div>
            </div>
        </div>
    </div>

    <script src="js/text-utils.js"></script>
    <script src="js/pokemon-detail.js"></script>
</body>
</html>
