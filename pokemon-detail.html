<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Details</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text: #14213d;
            --muted: #6b7280;
            --border: #d8e0ea;
            --primary: #2f6fed;
            --accent: #ff7a00;
            --shadow: 0 10px 30px rgba(20, 33, 61, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 24px;
        }
        .hero {
            display: grid;
            grid-template-columns: minmax(180px, 240px) 1fr;
            gap: 24px;
            align-items: center;
        }
        .hero img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            border-radius: 16px;
            background: #f7f9fc;
            border: 1px solid var(--border);
        }
        .eyebrow {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        h1 { margin: 0 0 8px; font-size: 2rem; }
        .meta { color: var(--muted); margin-bottom: 12px; }
        .types { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
        .type-pill {
            padding: 6px 10px;
            border-radius: 999px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .type-grass { background: #78C850; }
        .type-fire { background: #F08030; }
        .type-water { background: #6890F0; }
        .type-electric { background: #F8D030; color: #1f2937; }
        .type-psychic { background: #F85888; }
        .type-ice { background: #98D8D8; color: #1f2937; }
        .type-dragon { background: #7038F8; }
        .type-dark { background: #705848; }
        .type-fairy { background: #EE99AC; color: #1f2937; }
        .type-fighting { background: #C03028; }
        .type-poison { background: #A040A0; }
        .type-ground { background: #E0C068; color: #1f2937; }
        .type-rock { background: #B8A038; }
        .type-bug { background: #A8B820; }
        .type-ghost { background: #705898; }
        .type-steel { background: #B8B8D0; color: #1f2937; }
        .type-normal { background: #A8A878; }
        .section {
            margin-top: 24px;
            border-top: 1px solid var(--border);
            padding-top: 18px;
        }
        .section h2 { margin: 0 0 12px; font-size: 1.12rem; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .panel {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            background: #fcfdff;
        }
        .panel ul { margin: 0; padding-left: 18px; }
        .panel li { margin-bottom: 6px; }
        .stat-list { display: grid; gap: 8px; }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eef2f7; }
        .status { color: var(--muted); font-size: 0.95rem; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #eef4ff;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.9rem;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .muted { color: var(--muted); }
        @media (max-width: 760px) {
            .hero { grid-template-columns: 1fr; text-align: center; }
            .hero img { margin: 0 auto; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="back-link" href="Test Site.html">← Back to Pokémon database</a>
            <div class="status" id="status">Loading details…</div>
        </div>
        <div class="card" id="detail-card" hidden>
            <div class="hero">
                <img id="sprite" alt="Pokémon sprite" />
                <div>
                    <div class="eyebrow" id="eyebrow">Pokémon details</div>
                    <h1 id="name"></h1>
                    <div class="meta" id="meta"></div>
                    <div class="types" id="types"></div>
                    <div id="description" class="muted"></div>
                </div>
            </div>

            <div class="section">
                <h2>Abilities</h2>
                <div id="abilities"></div>
            </div>

            <div class="section">
                <h2>Base stats</h2>
                <div id="stats" class="stat-list"></div>
            </div>

            <div class="section">
                <div class="grid">
                    <div class="panel">
                        <h2>Moves learned by level up</h2>
                        <div id="level-up-moves"></div>
                    </div>
                    <div class="panel">
                        <h2>TM/HM and other machines</h2>
                        <div id="machine-moves"></div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="grid">
                    <div class="panel">
                        <h2>Wild encounters</h2>
                        <div id="encounters"></div>
                    </div>
                    <div class="panel">
                        <h2>Additional notes</h2>
                        <div id="notes" class="muted"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const pokemonId = params.get('id');
        const statusEl = document.getElementById('status');
        const detailCard = document.getElementById('detail-card');

        function titleCase(value) {
            return String(value || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function typeClass(type) {
            return 'type-' + String(type || '').toLowerCase();
        }

        function renderTypes(types) {
            const container = document.getElementById('types');
            container.innerHTML = '';
            (types || []).forEach(type => {
                const pill = document.createElement('span');
                pill.className = 'type-pill ' + typeClass(type);
                pill.textContent = titleCase(type);
                container.appendChild(pill);
            });
        }

        function renderStats(stats) {
            const container = document.getElementById('stats');
            container.innerHTML = '';
            const rows = [
                ['HP', stats?.hp],
                ['Attack', stats?.attack],
                ['Defense', stats?.defense],
                ['Sp. Atk', stats?.['special-attack']],
                ['Sp. Def', stats?.['special-defense']],
                ['Speed', stats?.speed]
            ];
            rows.forEach(([label, value]) => {
                const row = document.createElement('div');
                row.className = 'stat-row';
                row.innerHTML = `<strong>${label}</strong><span>${value ?? '—'}</span>`;
                container.appendChild(row);
            });
        }

        function renderList(containerId, items) {
            const container = document.getElementById(containerId);
            if (!items || !items.length) {
                container.innerHTML = '<div class="muted">No data available yet.</div>';
                return;
            }
            const list = document.createElement('ul');
            items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                list.appendChild(li);
            });
            container.innerHTML = '';
            container.appendChild(list);
        }

        async function loadPokemonData() {
            try {
                const response = await fetch('./json/pokemon-full-data.json');
                if (!response.ok) throw new Error('Unable to load local data');
                return await response.json();
            } catch (error) {
                console.error(error);
                return [];
            }
        }

        async function loadDetails() {
            if (!pokemonId) {
                statusEl.textContent = 'No Pokémon selected.';
                return;
            }

            const allPokemon = await loadPokemonData();
            const pokemon = allPokemon.find(entry => String(entry.id) === String(pokemonId));
            if (!pokemon) {
                statusEl.textContent = 'Pokémon not found.';
                return;
            }

            document.getElementById('name').textContent = titleCase(pokemon.name);
            document.getElementById('meta').textContent = `#${String(pokemon.id).padStart(3, '0')} • ${titleCase(pokemon.region || 'unknown region')}`;
            document.getElementById('eyebrow').textContent = 'Pokémon details';
            document.getElementById('sprite').src = pokemon.sprite || '';
            document.getElementById('sprite').alt = pokemon.name;
            renderTypes(pokemon.types || []);
            renderStats(pokemon.stats || {});
            document.getElementById('description').textContent = pokemon.flavor_text || 'No flavor text available yet.';

            const abilities = [];
            if (Array.isArray(pokemon.ability_details) && pokemon.ability_details.length) {
                pokemon.ability_details.forEach(ability => {
                    const label = ability?.is_hidden ? 'Hidden' : 'Ability';
                    abilities.push(`${titleCase(ability?.name || '')} (${label})`);
                });
            } else {
                (pokemon.abilities || []).forEach(ability => abilities.push(titleCase(ability)));
            }
            document.getElementById('abilities').innerHTML = abilities.length
                ? `<div>${abilities.map(item => `<span class="pill">${item}</span>`).join('')}</div>`
                : '<div class="muted">No abilities recorded.</div>';

            try {
                const pokeApiRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
                if (pokeApiRes.ok) {
                    const pokeApiData = await pokeApiRes.json();
                    const levelUpMoves = [];
                    const machineMoves = [];
                    for (const move of pokeApiData.moves || []) {
                        for (const version of move.version_group_details || []) {
                            const method = version?.move_learn_method?.name;
                            const level = version?.level_learned_at;
                            const moveName = titleCase(move.move?.name || '');
                            if (method === 'level-up') {
                                levelUpMoves.push(`Level ${level}: ${moveName}`);
                            } else if (method === 'machine') {
                                machineMoves.push(`TM/HM: ${moveName}`);
                            } else if (method === 'tutor') {
                                machineMoves.push(`Tutor: ${moveName}`);
                            }
                        }
                    }
                    levelUpMoves.sort((a, b) => Number(a.match(/\d+/)?.[0] || 0) - Number(b.match(/\d+/)?.[0] || 0));
                    machineMoves.sort((a, b) => a.localeCompare(b));
                    renderList('level-up-moves', levelUpMoves.slice(0, 20));
                    renderList('machine-moves', machineMoves.slice(0, 20));
                } else {
                    renderList('level-up-moves', []);
                    renderList('machine-moves', []);
                }
            } catch (error) {
                console.warn('Could not load move data', error);
                renderList('level-up-moves', []);
                renderList('machine-moves', []);
            }

            try {
                const encountersRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}/encounters`);
                if (encountersRes.ok) {
                    const encounters = await encountersRes.json();
                    const encounterItems = (encounters || []).map(entry => {
                        const area = titleCase(entry?.location_area?.name || 'Unknown area');
                        const methods = (entry?.version_details || []).flatMap(detail => detail?.encounter_details || []).map(detail => {
                            const method = titleCase(detail?.method?.name || '');
                            const chance = detail?.chance != null ? ` • ${detail.chance}% chance` : '';
                            return `${method}${chance}`;
                        });
                        return `${area}${methods.length ? ` — ${methods.join(', ')}` : ''}`;
                    });
                    renderList('encounters', encounterItems.slice(0, 20));
                } else {
                    renderList('encounters', []);
                }
            } catch (error) {
                console.warn('Could not load encounter data', error);
                renderList('encounters', []);
            }

            document.getElementById('notes').innerHTML = `
                <div>This page uses the local database for the core details and pulls live move and encounter data when the browser can reach PokéAPI.</div>
                <div style="margin-top:8px;">Tip: use the browser back button to return to the main list.</div>
            `;
            detailCard.hidden = false;
            statusEl.textContent = 'Details ready.';
        }

        loadDetails();
    </script>
</body>
</html>
